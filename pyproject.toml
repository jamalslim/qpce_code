[project]
name = "qpce"
version = "1.0.0"
description = "Quantum polynomial chaos expansion. One interferometric circuit generates calorimeter shower marginals and their correlations, with no classical decoder."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
figures = ["mplhep>=0.3"]
progress = ["tqdm>=4.65"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
